<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App-Deck</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230d9488'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">App-Deck</span>
      </div>
      <div class="topbar-actions">
        <label class="switch" title="daemon">
          <span class="switch-label" data-i18n="daemon"></span>
          <input type="checkbox" id="daemonSwitch">
          <span class="switch-track"></span>
        </label>
        <label class="switch" title="startup">
          <span class="switch-label" data-i18n="startup"></span>
          <input type="checkbox" id="startupSwitch">
          <span class="switch-track"></span>
        </label>
        <button class="icon-btn" id="langBtn" title="Language">EN</button>
        <button class="primary-btn" id="addAppBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="addApp"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="appList"></div>
    <div id="emptyState" class="empty hidden">
      <div class="empty-mark">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/><path d="M9 9v11"/></svg>
      </div>
      <p data-i18n="emptyHint"></p>
      <button class="primary-btn" data-action="add-app">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="addApp"></span>
      </button>
    </div>
  </main>

  <div id="overlay" class="overlay hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-hidden="true"></aside>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="i18n.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
